<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Pizza</title>
    <script src="js/message.js" defer></script>
    <script src="js/form.js" defer></script>
    <script src="js/calculatePrice.js" defer></script>
    <script src="js/formatCurrency.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/price.js" defer></script>
    <script src="js/main.js" defer></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="containerHeader">
            <div class="backOption">
                <a href="./home.html">
                    <img src="../assets/seta.png" alt="">
                </a> 
            </div>
            <div class="imgHeader">
                <a href="./home.html">
                    <img src="../assets/logo.png">
                </a>
            </div>
            <div class="menuOption">
                <img src="../assets/menu.png" alt="">
            </div>
        </div>
    </header>
    <main>

        <form id="pizza-form">
            <section class="pizzaSize">
                <label for="size">Escolha o tamanho</label>
                <select id="size" name="size" required>
                    <option value="pequena">Pequena</option>
                    <option value="media">Média</option>
                    <option value="grande">Grande</option>
                </select>
            </section>

            <section class="pizzaFlavor">
                <label for="flavor">Sabores</label>
                <div class="flavorContainer">
                    <select id="flavor" name="flavor" required>
                        <option value="peperoni">Peperoni</option>
                        <option value="mussarela">Mussarela</option>
                        <option value="frango">Frango</option>
                    </select>
                    <div class="flavorContent">
                        <div class="imgFlavor">
                            <img id="flavorImage" src="../assets/pepperoni.jpg" alt="">
                        </div>
                        <p id="flavorDescription">Pepperoni delicioso e picante</p>
                    </div>
                </div>
            </section>

            <section class="pizzaEdgeBackground">
                <section class="pizzaEdge">
                    <label for="edge">Borda</label>
                    <select id="edge" name="edge" required>
                        <option value="catupiry">Catupiry</option>
                        <option value="cheddar">Cheddar</option>
                        <option value="sem borda">Sem borda</option>
                    </select>
                </section>
            </section>

            <section class="pizzaAccompaniment">
                <label for="accompaniment">Acompanhamentos</label>
                <select id="accompaniment" name="accompaniment" required>
                    <option value="coca-cola">Coca-Cola</option>
                    <option value="guarana">Guaraná</option>
                </select>
            </section>

            <section class="pizzaQuantityBackground">
                <div class="pizzaQuantity">
                    <label for="quantity">Quantidade:</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1">
                </div>
            </section>

            <section class="pizzaDelivery">
                <div class="deliveryContent">
                    <label for="delivery">Delivery:</label>
                    <input type="checkbox" id="delivery" name="delivery">
                </div>
            </section>

            <section class="pizzaButton">
                <div>
                    <button class="buttons" type="button" onclick="addToCart()">Adicionar ao Carrinho</button>
                    <button class="buttons" type="button" onclick="clearCart()">Limpar Carrinho</button>
                </div>
                <button id="finishButton" type="button" onclick="finalizeOrder()">Finalizar Pedido</button>
            </section>
        </form>

        <section class="cartContainer">
            <div id="cart" class="pizzaCart">
                <h2>Carrinho</h2>
                <ul id="cart-items">
                </ul>
                <h3><span id="total-price">R$0,00</span></h3>
            </div>
        </section>
    </main>
</body>
</html>
